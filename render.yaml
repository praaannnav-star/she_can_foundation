services:
  - type: web
    name: shecan-foundation-flask
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shecan-foundation-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: She Can Admin

databases:
  - name: shecan-foundation-db
    databaseName: shecan_foundation
    user: shecan_admin
