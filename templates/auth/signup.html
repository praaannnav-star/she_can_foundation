{% extends "base.html" %}
{% block title %}Sign Up | She Can Foundation{% endblock %}
{% block content %}
<section class="auth-shell">
  <form class="form-card auth-card" method="post">
    <p class="eyebrow">Join The Team</p>
    <h1>Create account</h1>
    <label>Name
      <input type="text" name="name" value="{{ form.name or '' }}" minlength="2" required>
      {% if errors.name %}<span class="field-error">{{ errors.name }}</span>{% endif %}
    </label>
    <label>Email
      <input type="email" name="email" value="{{ form.email or '' }}" required>
      {% if errors.email %}<span class="field-error">{{ errors.email }}</span>{% endif %}
    </label>
    <label>Password
      <input type="password" name="password" minlength="6" required>
      {% if errors.password %}<span class="field-error">{{ errors.password }}</span>{% endif %}
    </label>
    <button class="button" type="submit">Sign Up</button>
    <p>Already registered? <a href="{{ url_for('main.login') }}">Login</a></p>
  </form>
</section>
{% endblock %}
